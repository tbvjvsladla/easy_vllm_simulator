x-gpu-common: &gpu-common
  build:
    context: .
    dockerfile: Dockerfile
  runtime: nvidia
  network_mode: host
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  devices:
    - /dev/infiniband:/dev/infiniband
  volumes:
    - /mnt/llm/Model/hugging_face_ver_model:/app/models:ro # 모델 폴더는 읽기모드로만
    - /mnt/llm/quant_model:/app/quant_models:ro
    - /home/cona/ws_docker/model_repo/tiktoken_encodings:/encodings:ro
    - ./configs:/app/configs:ro
  environment: &gpu-env
    # ─────────────────────────────────────────────────────────
    # RDMA (RoCE v2) 설정 — 실제 텐서 데이터가 흐르는 고속 경로
    # ─────────────────────────────────────────────────────────
    NCCL_IB_DISABLE: "0"                  # 0=RDMA 활성, 1=TCP로 fallback
    NCCL_IB_HCA: rocep1s0f1,roceP2p1s0f1  # Domain 0/2 HCA 둘 다 지정 → NCCL 멀티레일로 ~200Gbps 활용

    # ─────────────────────────────────────────────────────────
    # TCP 소켓 인터페이스 — 초기화/제어 메시지용 (RDMA 보조)
    # ─────────────────────────────────────────────────────────
    NCCL_SOCKET_IFNAME: enp1s0f1np1,enP2p1s0f1np1 # NCCL bootstrap 및 RDMA 불가 시 fallback
    GLOO_SOCKET_IFNAME: enp1s0f1np1,enP2p1s0f1np1 # vLLM/Ray 초기 핸드셰이크 (torch.distributed gloo 백엔드)
    TP_SOCKET_IFNAME: enp1s0f1np1,enP2p1s0f1np1   # torch.distributed TCP 통신 인터페이스

    # ─────────────────────────────────────────────────────────
    # 기타 HPC 통신 레이어 — vLLM+Ray 조합에서는 실사용 빈도 낮으나
    # Wi-Fi/10GbE 인터페이스 선택 방지용으로 명시 (안전장치)
    # ─────────────────────────────────────────────────────────
    UCX_NET_DEVICES: enp1s0f1np1,enP2p1s0f1np1              # UCX 프레임워크용 (OpenMPI 등에서 사용)
    OMPI_MCA_btl_tcp_if_include: enp1s0f1np1,enP2p1s0f1np1  # OpenMPI TCP BTL 인터페이스 화이트리스트

services:
  vllm:
    <<: *gpu-common
    container_name: vllm_server
    profiles: [debug]
    environment:
      <<: *gpu-env
      TIKTOKEN_ENCODINGS_BASE: /encodings
      # ★ VLLM_HOST_IP 제거 — debug-init.sh가 런타임에 자동 감지
      # ★ SERVING_PORT 제거 — 기본값 8081 사용, 필요 시 CLI로 덮어쓰기 가능
    command: ["bash", "--rcfile", "/app/configs/debug-init.sh"]
    tty: true
    stdin_open: true

  # ─────────────────────────────────────────────────────────────────
  # 마스터 노드 서빙 (Ray head + vLLM serve)
  # ─────────────────────────────────────────────────────────────────
  vllm-master-serve:
    <<: *gpu-common
    profiles: [master]
    container_name: ${MASTER_CONTAINER_NAME:-vllm-master-serve-container}
    environment:
      <<: *gpu-env
      TIKTOKEN_ENCODINGS_BASE: /encodings
      NODE_ROLE: master
      VLLM_HOST_IP: ${MASTER_HOST_IP}      # 자기 IP = master
      HEAD_NODE_IP: ${MASTER_HOST_IP}      # head는 자기 자신
      RAY_PORT: ${RAY_PORT:-6379}
      SERVING_IP: ${SERVING_IP:-0.0.0.0}
      SERVING_PORT: ${SERVING_PORT:-8080}
      SERVING_MODEL_NAME: ${SERVING_MODEL_NAME}
      CONFIG_FILE: ${CONFIG_FILE:-default}
    env_file:
      - envs/.env.${CONFIG_FILE:-default}
    command: ["bash", "/app/configs/${CONFIG_FILE:-default}.sh"]

  # ─────────────────────────────────────────────────────────────────
  # 슬레이브 노드 서빙 (Ray worker --block)
  # ─────────────────────────────────────────────────────────────────
  vllm-slave-serve:
    <<: *gpu-common
    profiles: [slave]
    container_name: ${SLAVE_CONTAINER_NAME:-vllm-slave-serve-container}
    environment:
      <<: *gpu-env
      TIKTOKEN_ENCODINGS_BASE: /encodings
      NODE_ROLE: slave
      VLLM_HOST_IP: ${SLAVE_HOST_IP}       # 자기 IP = slave
      HEAD_NODE_IP: ${MASTER_HOST_IP}      # master에 접속
      RAY_PORT: ${RAY_PORT:-6379}
      CONFIG_FILE: ${CONFIG_FILE:-default}
    env_file:
      - envs/.env.${CONFIG_FILE:-default}
    command: ["bash", "/app/configs/${CONFIG_FILE:-default}.sh"]