# gpt-oss-20b 기본 서빙 설정 (vllm serve --config 용)
# 단일노드 스모크용 경량 프로파일 (gpt-oss-120b-normal 기반, 20b 경로·메모리 축소)
model: /app/models/OpenAI/gpt-oss-20b
host: 0.0.0.0
port: 8000
gpu-memory-utilization: 0.3
max-model-len: 8192
max-num-seqs: 8
reasoning-parser: openai_gptoss
tool-call-parser: openai
enable-auto-tool-choice: true
