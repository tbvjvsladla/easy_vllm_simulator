  "_assignments_howto": [
    "노드별 셀 배정 = **배정의 단일 권위**(2026-09-08 · plan_26090813 D11). 옛 평면 `order` 를 대체한다 — 평면 목록은 '메인이 먼저 둘, 그 다음 서브가 둘' 같은 노드 분할을 표현하지 못했고, 그래서 병렬 캠페인이 순차로 돌았다.",
