    "mode 는 셀이 끝난 뒤의 전이다: AUTO(기본 · 생략 가능) = 정리 후 다음 셀로 · HITL = 정리 후 사람에게 묻고 대기 · STAY = 벤치 후 서빙을 유지(상주). STAY 는 각 노드 리스트의 **마지막 항목에만** 올 수 있다 — 뒤에 셀이 남으면 그 셀은 영원히 돌지 않는다.",
