# 셀 입력 — recipe.py --config 의 대상. 옛 루트 /config.yaml·/config.campaign-*.yaml 의 후속 자리다.
#
# ⚠ 이 파일은 NAS 절대경로 등 운영자 지문을 담는다. 인스턴스(campaigns/<camp-id>/)가 **비추적**인
#   것이 이 파일이 배포 평면에 닿지 않는 유일한 근거다 — 루트에 두었을 때 21개가 공개 원격까지
#   추적 누출됐다(root_registry tombstone · plan_26090616).
#
# 실측(measured)과 선언(declared)을 섞지 않는다: 타겟 HW 예산을 test_device_total_gib 에 적으면
# "쟀다"는 거짓이 된다(CLAUDE.md §결정론 산출물은 출처를 표시한다).

target_model:
  path: <<FILL>>                      # 컨테이너 내부 모델 경로
nas_host_root: <<FILL>>               # 호스트 NAS 루트(운영자 지문)
tiktoken_host_path: <<FILL>>          # 필요 모델만

# ── 실측(measured) ──
test_device_total_gib: <<FILL>>       # 이 노드의 실제 총량(GB10 통합메모리는 /proc/meminfo 가 권위)
vram_budget_gb: <<FILL>>
safety_margin: 0.90

# ── 선언 계층(declared_axes) · 사람이 적는 것이 정당한 값 (2026-09-14 · plan_26091407 §4.0) ──
# 셀의 값은 두 계층이다. **선언**(아래 블록)은 캠페인 설계가 정하는 축이라 사람이 적는 것이 정당하고,
# **explorer 파생**(max-num-seqs·KV 클램프·서빙 yaml gpu-memory-utilization)은 vllm-recipe-explorer 가
# 측정·재조정해 lockset.json 에 잠근다 — 파생값을 여기 손으로 적지 않는다. gmu 의 선언 입력은 아래
# target_gpu.target_gmu 하나이고 배포값은 거기서 파생된다. 종전에는 승자 셀 config 에 이 축들을 손으로
# 넣었고 뼈대에 자리가 없어 셀마다 모양이 달랐다(F1). 이 블록은 explorer 의 **입력 슬롯**이지 서빙 인자가
# 아니다(recipe.py 는 declared_axes.tp 로 TP 를 정하지 않는다 — TP 의 권위는 여전히 manifest 다).
# 읽는 코드는 recipe.py simulate 다(2026-09-14 · plan_26091407 단계 ②): concurrency_requirement·typical_request_tokens 는
#   max-num-seqs = min(요구, KV_fit@대표 길이) 산식의 입력이고, tp 는 해소 TP 와 대조해 lockset 에 기재만 한다.
#   나머지 축(context_len·variant·ple_mode·kv_cache_dtype·control_variable)은 아직 읽는 코드가 없는 선언이다.
#   빈칸은 --instance 검증이 막으므로, 요구가 없는 축은 추측하지 말고 null("선언하지 않았다")로 적는다.
declared_axes:
  context_len: <<FILL>>               # max-model-len 선언(토큰)
  variant: <<FILL>>                   # stock | <variant_id>(arch_variant_ledger.json 등재명)
  ple_mode: <<FILL>>                  # resident | mmap | none(PLE 없는 모델)
  kv_cache_dtype: <<FILL>>            # auto | fp8 | … (vLLM --kv-cache-dtype 어휘)
  tp: <<FILL>>                        # 선언 TP. manifest 파생값과 다르면 선언이 틀린 것이다
  control_variable: <<FILL>>          # 이 셀이 속한 스윕의 통제변인 문장(broad_search init --control-variable 과 같은 문장).
                                      #   layer-1 control_variables 의 정본은 campaign.yaml 이다 — 여기 복제하지 않는다.
  concurrency_requirement: <<FILL>>   # 사용자 동시성 요구(동시 요청 수). max-num-seqs 산식의 선언 입력 · 요구 없음(lite 만 재는 셀 등) = null(→ batch 미정 · max-num-seqs 미emit)
  typical_request_tokens: <<FILL>>    # KV-fit 대표 요청 길이(입력+출력 토큰). KV_fit = 엔진 kv_cache_tokens ÷ 이 값 · 선언 안 함 = null(→ max_model_len 으로 보수 산정)

# ── 선언(declared) · 통제변인 ──
target_gpu:
  gpu_model: <<FILL>>
  per_card_vram_gib: <<FILL>>
  target_gmu: <<FILL>>              # 타겟에서 돌 gmu(safe_gmu = deploy_gmu 의 정본 · 기본값 없음 — 뼈대가 상수로 채우면 선언처럼 보이는 기본값이 된다).
                                    #   explorer 가 서빙 yaml gpu-memory-utilization 으로 emit 하고 클램프 천장 승수로 쓴다(통합메모리 타겟 ≤ 0.90).
                                    #   위 safety_margin 은 다른 칸(예산 검증 게이트 승수)이다. 서빙 yaml 과 다르면 cell.status.provenance_mismatch[] 에 기재된다
  cards_per_node: 1

kv_cache_dtype_bytes: 1
serving:
  config_name: <<FILL>>               # = cell_id. 이름이 곧 증거 연결이다(hint 게이트가 이걸로 묶는다).
  port: 8080
  served_model_name: <<FILL>>
