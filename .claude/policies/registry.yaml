          "clause_id": "KV_ABSOLUTE_CLAMP_PORTABILITY.C4",
          "statement": "Target hardware is config-time intent, declared in vllm-recipe-explorer's own config.yaml -- orthogonal to manifest-observed hardware facts: what manifest.yaml physically scans on this node is a different plane from what config.yaml declares as the porting destination."
