      "policy_id": "GIT_SINGLE_AUTHORITY",
      "owner": "upstream-version-watch",
      "statement": "Git is the single authority over the bytes it already carries: an integrity digest or a copy belongs only where git does NOT carry the bytes, recovery is git history plus regeneration rather than a side copy, and reproducibility is proven by rebuild+smoke rather than by comparing one transcription of git against another.",
      "scope": [
        "multi-node",
        "single-node"
      ],
      "origin_failure": "2026-09-01/03 full audit (docs/report/audit_26090121_해시_버전매칭_무결성_과잉_전수감사.md, plan_26090222): duplicated integrity layers had accumulated over git itself -- a tracked_index transcribing git blob sha1s, an evidence_manifest transcribing sha256s of the same tracked files, and a governed_prose_snapshot transcribing four prose digests. Every one of them re-stated a fact git already held, so the two copies could (and did) drift apart silently, and the recorded remedy for drift was to re-stamp the transcription rather than to ask git. The same habit produced backup artifacts (.bak/.orig copies, backup branches and folders) that git history already made unnecessary while hiding them from `git status` via ignore lines.",
      "clauses": [
        {
          "clause_id": "GIT_SINGLE_AUTHORITY.C1",
          "statement": "Backup practice is forbidden outright rather than hidden: no path whose name carries a `.bak`/`.orig` suffix or a `backup`/`백업` token may exist in the working tree, `.gitignore` may not carry `*.bak`/`*.orig` lines that would hide such a path from `git status`, `refs/heads` must stay a subset of {single-node, multi-node, hint}, and every tag must live under the `hint/` prefix -- a last-good anchor is a commit, never a tag or a branch of its own."
        },
        {
          "clause_id": "GIT_SINGLE_AUTHORITY.C2",
          "statement": "No tracked .json/.yaml/.yml file may restate a digest of bytes git already carries: the check is a derived predicate over the live tracked-blob digest set (git blob sha1 union sha256) with no allowlist, so a constant that moves file or a newly created file is still caught. Digests of inputs git does NOT carry -- upstream source payloads, fork pins, commit/tag object ids -- are outside the predicate's reach by construction, not exempted from it."
        }
