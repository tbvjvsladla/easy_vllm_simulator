      "policy_id": "LAST_GOOD_ROLLBACK_ANCHOR",
      "owner": "upstream-version-watch",
      "statement": "The rollback anchor is always the last local commit that passed smoke; single-node and multi-node roll back independently.",
      "scope": [
        "multi-node",
        "single-node"
      ],
      "universal_invariant": "This is a foundational reproducibility guarantee from the project's original bootstrap design (smoke-before-commit, Karpathy B4), not a fix derived from any single incident -- every version-bump cycle depends on it, so it is declared a universal invariant rather than backfilling a speculative incident citation.",
      "clauses": [
        {
          "clause_id": "LAST_GOOD_ROLLBACK_ANCHOR.C1",
          "statement": "The rollback anchor is always the last local commit that passed smoke -- never a partially-applied or uncommitted working tree, which is treated as disposable."
        },
        {
          "clause_id": "LAST_GOOD_ROLLBACK_ANCHOR.C2",
          "statement": "single-node and multi-node roll back independently -- a multi-node-only failure never reverts a passing single-node state."
        },
        {
          "clause_id": "LAST_GOOD_ROLLBACK_ANCHOR.C3",
          "statement": "Recovery restores the working tree to that anchor commit; origin, when configured, comes from the user's own environment value (manifest.origin_url) -- there is no hardcoded remote."
        }
      ],
      "evidence": [
