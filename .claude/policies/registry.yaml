    {
      "policy_id": "ROOT_SURFACE_REGISTRY",
      "owner": "terraforming_node",
      "statement": "The repository root is a shared surface no skill owns, so what may live there is declared once in .claude/policies/root_registry.json and everything a campaign produces lives in the campaigns/ artifact chain instead: skeleton tracked, instance volatile, evidence born in the docs plane, and the next campaign's init purges the previous instance only after those evidence pointers are proven to resolve.",
      "scope": [
        "multi-node",
        "single-node"
      ],
      "origin_failure": "2026-09-06 audit (plan_26090616): a 30h campaign wrote per-cell recipe inputs to the repository root as config.campaign-*.yaml / lockset.camp1-*.json. The root .gitignore rule was prefix-exact (/config.yaml, /lockset.json) so the varied names escaped it, the pre-commit PII tripwire's reach was .claude/ + docs/report/ + hints/, and verify_distribution scanned only the build plane -- no gate had jurisdiction over the root, and 21 files carrying operator NAS absolute paths reached a public remote with 5 forks. The same campaign published 2 of 3 expected hint tags because the information each stage needed from the previous one was carried by conversation memory rather than by an artifact, so a compacted or restarted session silently fell back to root defaults.",
      "clauses": [
