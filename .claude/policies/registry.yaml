          "clause_id": "ARCH_WALL_VARIANT_LADDER.C1",
          "statement": "When stock vLLM is structurally incapable (an arch-wall) of serving a target model, Docker patch scope may only expand along one fixed ladder: dependency patch, then source-gate patch, then a vLLM source-repo override pinned to a fork commit SHA (VLLM_REPO/VLLM_REF build-arg), then checkpoint replacement."
        },
        {
          "clause_id": "ARCH_WALL_VARIANT_LADDER.C2",
          "statement": "The result is a superset variant image (e.g. '...-source-sm12x'), never a model-keyed image."
        },
        {
          "clause_id": "ARCH_WALL_VARIANT_LADDER.C3",
          "statement": "Only one variant track may be active at a time."
        },
        {
          "clause_id": "ARCH_WALL_VARIANT_LADDER.C4",
          "statement": "Every override requires HITL approval backed by reference-grounded evidence -- never speculative."
        },
        {
          "clause_id": "ARCH_WALL_VARIANT_LADDER.C5",
          "statement": "Promotion requires a regression re-smoke of existing models on the new track before it becomes the default."
