      "owner": "vllm-recipe-explorer",
      "statement": "A final serving recipe sizes KV cache by a measured, absolute per-target-GPU byte value, config-time target intent stays orthogonal to manifest-observed hardware facts, and porting to a different GPU transfers the host-measured invariants rather than approximating them.",
