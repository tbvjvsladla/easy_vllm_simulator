      "policy_id": "HINT_TAG_ACTIVATION_GATE",
      "owner": "upstream-version-watch",
      "statement": "Validated recipes are distilled into knowledge-only hint tags, published main-only with fail-closed PII scanning and a carry-forward revalidation header, and selectively pushed so local rollback anchors never leak.",
      "scope": [
        "multi-node",
        "single-node"
      ],
      "origin_failure": "plan_26070222",
      "clauses": [
        {
          "clause_id": "HINT_TAG_ACTIVATION_GATE.C1",
          "statement": "Validated recipes are published as hint/<vllm>/<model>/<arch> annotated git tags containing distilled knowledge only -- never a finished, copy-paste-ready recipe payload; the tag body is itself the sole object (HEAD-only, no recipe files, index only)."
        },
        {
          "clause_id": "HINT_TAG_ACTIVATION_GATE.C2",
          "statement": "PII strip/scan over the full tag object AND the tagger identity that ships inside the pushed tag is fail-closed -- a scan failure blocks tag creation and finalization outright."
        },
        {
          "clause_id": "HINT_TAG_ACTIVATION_GATE.C3",
          "statement": "Every hint carries a mandatory carry-forward revalidation header (a map, not an answer) so a stale hint can never be treated as an executable recipe without re-verification against the consumer's own smoke."
        },
        {
          "clause_id": "HINT_TAG_ACTIVATION_GATE.C4",
          "statement": "Publication is main-only -- a building-block propagation axis, the same plane as references.md, independent of sub egress state -- sub nodes never author or publish hints."
        },
        {
          "clause_id": "HINT_TAG_ACTIVATION_GATE.C5",
          "statement": "Push is selective -- the refspec is the literal refs/tags/hint/* and --tags is forbidden -- so no ref outside the hint namespace can reach a public origin. The guard that makes this structural lives in cmd_push: any --tag outside the hint/ namespace is refused, so the rendered refspec can never widen to refs/tags/* and carry local refs outward. The rollback anchor is a local COMMIT, never a tag (2026-09-03 correction; the GIT_SINGLE_AUTHORITY tripwire forbids a last-good-* tag from existing at all), and the origin-side last-good-* existence scan cmd_verify used to carry was deleted in the same correction -- it asserted a condition about a tag this repo never creates."
        },
        {
          "clause_id": "HINT_TAG_ACTIVATION_GATE.C6",
          "statement": "Activation is proposal-only, after all prior work for the (vllm, model, arch) combination is finished (serving confirmed, docs/benchmark evidence published, sub propagation done) -- the agent proposes (Y/N), unattended auto-tagging is never allowed, and every push (hint tags AND branch pushes) remains the user's exclusive decision. A duplicate triple gets a reverify stamp only, never a fresh tag."
        }
      ],
      "evidence": [
        {
          "path": ".claude/skills/hint-publisher/scripts/hint_tag.py",
          "supports": [
