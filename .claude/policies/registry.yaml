{
  "schema_version": 2,
  "policies": [
    {
      "policy_id": "HOST_SAFETY_LAYERED_DEFENSE",
      "owner": "terraforming_node",
      "statement": "Unified-memory nodes are protected from host hard-down by layered defense that is only partly installation-independent -- opt-out changes what infrastructure is absent, never what the pre-load RAM gate itself still refuses.",
      "scope": [
        "multi-node",
        "single-node"
      ],
      "origin_failure": "plan_26071019",
      "clauses": [
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C1",
          "statement": "Layered defense = a systemd-resident mem_watchdog (broad @vllm mode) plus a harness-scoped watchdog instance auto-started by run_trial/multinode_serve_smoke.sh, container oom_score_adj=800, earlyoom as a process-level backstop, and a pre-load RAM gate that compares checkpoint total_size/TP plus a floor against MemAvailable. Broad mode selects kill targets by matching vllm against the container name and the image *repository* name only -- the registry and organisation path segments are outside the matching plane, so a measurement tool published under a vllm-named organisation is not killed alongside the server it is measuring, while servers whose container name carries no vllm are still caught through the image."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C2",
          "statement": "Installation is offered only as a terraforming session-final opt-in choice, surfaced after the completion Flag has already been issued, in an informative rather than mandatory tone, via human-executed sudo (install_host_safety.sh --apply), identically on main and sub."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C3",
          "statement": "Host-safety installation status is independent of the completion Flag -- the Flag stays valid whether or not host-safety is installed. An opt-out node is recorded as host_safety.installed:false in the manifest (a neutral record, not a rebuke) and gets exactly one chat-only warning line, only when serving on unified memory, with no serve-script or log banner code change."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C4",
          "statement": "Only the harness-scoped watchdog is guaranteed installation-independent: it keeps protecting an opt-out node's trials regardless of whether the systemd-resident watchdog was ever installed. The systemd-resident watchdog and the installed vllm-drop-caches helper may both be genuinely absent on an opt-out node -- when the helper is missing, try_drop_caches is skipped and truthfully reported, but the gate's own refusal (exit code 7 on insufficient memory) is preserved either way."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C5",
          "statement": "The standing watchdog daemon (observation plus protective-kill only, deployed via install_host_safety) is a deliberate, explicit exception to the project's 'no unattended autorun' trigger policy -- it never triggers a build, bump, or model download, which stay fully manual."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C6",
          "statement": "sudo delegation for page-cache drops uses exactly one fixed helper path via a single sudoers NOPASSWD entry; watchdog shutdown is PID-based only -- a blanket process-name kill is forbidden because it can match and kill its own invoking shell."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C7",
          "statement": "Post-mortem capture on unified-memory nodes is efi_pstore (NVRAM), not kdump: node-blackbox level L3 removes crashkernel and ramoops and disarms kdump-tools, because with kdump armed panic() jumps to __crash_kexec before kmsg_dump (crash_kexec_post_notifiers=N) so pstore can never be written, while the reservation costs 2.25 GiB of the very resource whose exhaustion causes the hard-down; on this platform ramoops additionally cannot survive a reset (an identical reserve_mem address across boots still yields 'error in header' after a clean reboot) and makedumpfile does not support kernel 6.17 so vmcore is structurally unavailable. L3 requires one reboot and stays an explicit HITL step, the legacy installer's --with-kdump is refused with that reason rather than silently removed, multi-node additionally cross-streams kmsg to the peer via netconsole, and capture is claimed only after verify_node_blackbox.sh --crash-test/--post-crash writes capture_verified."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C8",
          "statement": "The vllm-recipe-explorer owner-local cleanup_docker.py reclaims docker image/cache debris: it always prints a dry-run table of deletion candidates against a deterministic preserve-set first, and only deletes once a human explicitly re-invokes it with --apply; it is never a periodic/scheduled job -- its trigger points are the end of a version-bump S4 commit step and an end-of-session human query."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C9",
          "statement": "Removal of the legacy host-safety installation is a separate, non-installing script (node_blackbox/purge_host_safety.sh) so no node is ever left in a partially applied purge-plus-reinstall state: it defaults to dry-run and destroys only when a human re-invokes it with --apply as root; it refuses to run before the Phase 0 journal harvest unless the operator explicitly waives the gate with --no-require-seed or names a stored seed with --seed-dir, because the mem_watchdog journal is the envelope's only initial data and is unrecoverable once the unit is removed and its journal vacuumed; every destructive step propagates its rc into a single FAIL verdict so a failed removal can never print a clean purge verdict that a reinstall would then build on; stray narrow-scope watchdog processes are terminated by PID resolved through argv field anchors only, never by a blanket pgrep -f/pkill -f match; and the GRUB config is copied to a verified backup before regeneration, with residue judged only from a readable grub.cfg -- an unreadable file is reported as undecidable, never as clean."
        },
        {
          "clause_id": "HOST_SAFETY_LAYERED_DEFENSE.C10",
          "statement": "The full-mode measurement tool runs as a separate container owned by the benchmark skill under a teardown contract, which is a host-safety concern because the load generator shares unified memory with the inference server: its memory budget is explicitly declared with no default and enforced by the kernel via --memory, it is launched with --rm and removed by a teardown trap on every exit path so a crashed run cannot leak a container that keeps holding memory, and its image is resolved from a tracked digest pin whose absence and drift are distinguishable fail-closed refusals rather than an implicit pull. The inference server itself is still never started or stopped by this skill."
        }
      ],
