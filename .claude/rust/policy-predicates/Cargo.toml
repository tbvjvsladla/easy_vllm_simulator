[package]
name = "policy-predicates"
version = "0.1.0"
edition = "2021"
description = "Rust port of .claude/policies/predicates/{claim_predicates,companion_predicate,runtime_patch_predicate}.py: one predicate_<POLICY>_C<n> per registry clause plus the two companion unittest suites; clauses whose original drives another bundle's Python in-process are reported NOT_PORTED and fail closed"
publish = false
# `tests/` is a scratch name in this repository; integration checks live in `checks/`.
autotests = false

[lib]
name = "policy_predicates"
path = "src/lib.rs"

[[bin]]
name = "claim_predicates"
path = "src/bin/claim_predicates.rs"

[[bin]]
name = "companion_predicate"
path = "src/bin/companion_predicate.rs"

[[bin]]
name = "runtime_patch_predicate"
path = "src/bin/runtime_patch_predicate.rs"

[[test]]
name = "predicate_checks"
path = "checks/predicate_checks.rs"

[[test]]
name = "selftest_checks"
path = "checks/selftest_checks.rs"

[[test]]
name = "upstream_checks"
path = "checks/upstream_checks.rs"

[[test]]
name = "recipe_checks"
path = "checks/recipe_checks.rs"

[[test]]
name = "tf_checks"
path = "checks/tf_checks.rs"

[[test]]
name = "hint_checks"
path = "checks/hint_checks.rs"

# Contract checks of the fixed surface (plan 26111805, cell c21c-contract-tests).
[[test]]
name = "contract_checks"
path = "checks/contract_checks.rs"

[dependencies]
# Python-compatible JSON reader (json.loads of registry.yaml / claim_bindings.json / settings templates).
agent-runtime-support = { path = "../runtime-support" }
# Python `re` semantics (lookbehind in the original patterns).
fancy-regex = "=0.19.2"
# hashlib.sha256 of the stamped patch bytes.
sha2 = "=0.10.9"
# The topology_parity library (role_contract::topology), the Rust owner of the four-way parity predicate.
role-contract = { path = "../role-contract" }
# Owner libraries the clauses drive in-process (the analogue of the original's `import` of the owner module):
# hint-publisher `hintlib`, the recipe-explorer / upstream-version-watch runtimes, the terraforming_node runtime,
# the registry auditor (arch variant contract) and the runtime selftest tripwires.
hint-publisher = { path = "../../skills/hint-publisher/rust" }
recipe-runtime = { path = "../../skills/vllm-recipe-explorer/rust/runtime" }
upstream-runtime = { path = "../../skills/upstream-version-watch/rust/runtime" }
terraforming-runtime = { path = "../../skills/terraforming_node/rust" }
policy-audit = { path = "../policy-audit" }
policy-selftest = { path = "../policy-selftest" }
# campaign_init / campaign_template_validator / scan_node command line (lib `sweep_stop`: campaign_write, campaign_validator,
# scan_node_cli source), the Rust owner behind terraforming_node/scripts/campaign_init.sh.
sweep-stop = { path = "../../skills/adversarial-benchmark/rust" }
# completion_gate (`policy_gate::ALLOWED_ACTIONS`): HINT_TAG_ACTIVATION_GATE reads the gate's action vocabulary in-process.
policy-gate = { path = "../policy-gate" }
