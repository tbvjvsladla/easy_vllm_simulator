[package]
name = "policy-distribution"
version = "0.1.0"
edition = "2021"
description = "Rust port of .claude/policies/runtime/verify_distribution.py: the fail-closed acceptance of the five-skill self-contained distribution (static contract checks + the named self-test runs + the clock scan + the policy audit), the original's JSON report with the differences listed in README.md"
publish = false
autotests = false

[lib]
name = "policy_distribution"
path = "src/lib.rs"

[[bin]]
name = "verify_distribution"
path = "src/bin/verify_distribution.rs"

[[test]]
name = "pure_goldens"
path = "checks/pure_goldens.rs"

[[test]]
name = "contract_checks"
path = "checks/contract_checks.rs"

[dependencies]
agent-runtime-support = { path = "../runtime-support" }
fancy-regex = "=0.19.2"
hint-publisher = { path = "../../skills/hint-publisher/rust" }
