[package]
name = "parity"
version = "0.1.0"
edition = "2021"
description = "Golden compare tool for the Rust repack (committed goldens only; no original is ever run): four channels (stdout, stderr, exit code, written files), a closed normalization list, Python-exec count via strace"
publish = false
autotests = false

[[bin]]
name = "parity"
path = "src/main.rs"

# Contract checks of the fixed surface (plan 26111805, cell c21-contract-tests).
[[test]]
name = "contract_checks"
path = "checks/contract_checks.rs"

[dependencies]
