[[test]]
name = "stdout_boundary"
path = "checks/stdout_boundary.rs"

[[test]]
name = "roofline_verdict_api"
path = "checks/roofline_verdict_api.rs"

[[test]]
name = "roofline_verdict_cli"
path = "checks/roofline_verdict_cli.rs"

[[test]]
name = "roofline_verdict_layouts"
path = "checks/roofline_verdict_layouts.rs"

[[test]]
