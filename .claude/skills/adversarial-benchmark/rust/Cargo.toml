[package]
name = "sweep-stop"
version = "0.1.0"
edition = "2021"
description = "Broad Search stop-condition evaluator: Rust port of adversarial-benchmark/scripts/sweep_stop.py"
publish = false
build = "build.rs"
# `tests/` is a scratch name in this repository; integration checks live in `checks/`.
autotests = false

[lib]
name = "sweep_stop"
path = "src/lib.rs"

[[bin]]
name = "sweep_stop"
path = "src/bin/sweep_stop.rs"

[[bin]]
name = "parse_bench"
path = "src/bin/parse_bench.rs"

[[bin]]
name = "parse_guidellm"
path = "src/bin/parse_guidellm.rs"

[[bin]]
name = "parse_guidellm_bench"
path = "src/bin/parse_guidellm_bench.rs"

[[bin]]
name = "roofline"
path = "src/bin/roofline.rs"

[[bin]]
name = "verdict_rule"
path = "src/bin/verdict_rule.rs"

[[bin]]
name = "repeat_axis"
path = "src/bin/repeat_axis.rs"

[[bin]]
name = "repeat_axis_api"
path = "src/bin/repeat_axis_api.rs"

[[bin]]
name = "repeat_axis_bench"
path = "src/bin/repeat_axis_bench.rs"

[[bin]]
name = "sweep_stop_bench"
path = "src/bin/sweep_stop_bench.rs"

[[bin]]
name = "lite_metrics"
path = "src/bin/lite_metrics.rs"

[[bin]]
name = "lite_metrics_api"
path = "src/bin/lite_metrics_api.rs"

[[bin]]
name = "lite_metrics_bench"
path = "src/bin/lite_metrics_bench.rs"

[[bin]]
name = "bench_preset"
path = "src/bin/bench_preset.rs"

[[bin]]
name = "bench_preset_api"
path = "src/bin/bench_preset_api.rs"

[[bin]]
name = "bench_preset_bench"
path = "src/bin/bench_preset_bench.rs"

[[bin]]
name = "classify_cell"
path = "src/bin/classify_cell.rs"

[[bin]]
name = "classify_cell_api"
path = "src/bin/classify_cell_api.rs"

[[bin]]
name = "classify_cell_bench"
path = "src/bin/classify_cell_bench.rs"

[[test]]
name = "oracle_cases"
path = "checks/oracle_cases.rs"

[[test]]
