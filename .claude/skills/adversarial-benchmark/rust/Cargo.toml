[dependencies]
num-bigint = "0.4"
num-traits = "0.2"
# SHA-256 of the dataset source (`hashlib.sha256` of the original): the `ring` digest `Context` (its own aarch64/x86_64
# assembly with run-time CPU feature dispatch), pinned exactly. Replaced the first plan, `sha2` =0.10.9 (kept in PORTING.md).
ring = "=0.17.14"
# Safe wrappers of TIOCGWINSZ on stdout only (what shutil.get_terminal_size asks via os.get_terminal_size), of
# fstat on stdout (the buffer size and presence of the interpreter's sys.stdout) and of getuid/getgid (the user a
# preprocessing container runs as).
rustix = { version = "1", default-features = false, features = ["std", "termios", "fs", "process", "event", "time"] }
# HTTPS client of the GuideLLM release lookup (the original's `urllib.request.urlopen`): a small synchronous client,
# pinned exactly. Rustls with `ring` (already built by the managed C/asm bootstrap). No gzip/charset/JSON/cookie
# features: the body is read as raw bytes and decoded by this crate's Python-compatible JSON decoder. Trust is not the
# client's built-in choice: the CA file and directories are selected like OpenSSL does (two independent sources, see
# `guidellm_release_http`) and loaded with `rustls-native-certs` (PEM files from given paths only) and `openssl-probe`
# (the known default locations of the host); both were already in the tree as transitive dependencies.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
rustls-native-certs = { version = "0.8", default-features = false }
openssl-probe = "0.2"

# The checks open a pseudo-terminal pair of their own to observe the width query.
[dev-dependencies]
rustix = { version = "1", default-features = false, features = ["std", "termios", "pty", "fs"] }
# The server side of the live HTTPS regression (`checks/guidellm_release_tls_cases.rs`): the same rustls the client
# already links, with `ring`; no new crate enters the lock.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[build-dependencies]
serde_json = "1"

