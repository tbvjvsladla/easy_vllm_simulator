# default_preset.yaml — full-bench(현재 구현체 GuideLLM) 측정 형상 프리셋 · 유일한 기본값 층
#   (plan_26101011 · 데이터셋 축 plan_26101614)
#
# 편집 규칙 · knob 읽는 법(owner/options/grade) · 해소 순서 · serving_cap · 사용자 프리셋 만드는 법은
# 같은 폴더의 README.md 가 정본이다. 이 파일에는 knob 별 사정(왜 이 선택지인가)만 적는다.
# 키를 늘리거나 지우면 selftest_bench_preset.py(리뷰)와 bench_preset.py(기동)가 둘 다 막는다.

schema_version: 1
bench: full-bench
tool: guidellm

# ── 근거 코드 ── Agent 가 값을 남길 때 쓰는 코드의 유일한 정의 자리. knob 은 이름만 참조한다.
reason_codes:
  preset_default: 프리셋 기본값 그대로
  human_pin: 사람 핀(campaign.yaml budgets.bench_pins · CLI --pinned-by · --repeats-source 선언 전달)
  serving_context: explorer 서빙 yaml 의 context window(max-model-len)에 맞춤
  serving_concurrency: explorer 서빙 yaml 의 동시 시퀀스 한계(max-num-seqs)에 맞춤
  harmony_completion: harmony 계열(gpt-oss) → 완결 엔드포인트(openai)
  chat_template: chat 템플릿 엔드포인트(openai-chat)
  host_budget: 노드 서빙 예산 선언에 맞춘 벤치 컨테이너 메모리 몫
  prior_cell_shape: 비교할 과거 셀의 측정 형상에 맞춤

knobs:
  # ── 동시성 레벨 ── 판정점 1 은 항상 포함된다(verdict 재사용). 서빙 max-num-seqs 를 넘는 레벨은 걸러진다.
  levels:
    owner: agent
    kind: list
    default: [1, 2, 4, 8, 16]
    serving_cap: le_max_num_seqs
    options:
      - {value: 1, grade: auto}
      - {value: 2, grade: auto}
      - {value: 4, grade: auto}
      - {value: 8, grade: auto}
      - {value: 16, grade: auto}
      - {value: 32, grade: confirm}
    reasons: [preset_default, human_pin, serving_concurrency, prior_cell_shape]

  # ── 입력 프롬프트 길이(토큰) ── 서빙 context window 안에서만 유효하다.
  input_len:
    owner: agent
    kind: scalar
    default: 1024
    serving_cap: input_plus_output_le_max_model_len
    options:
      - {value: 512, grade: auto}
      - {value: 1024, grade: auto}
      - {value: 2048, grade: auto}
      - {value: 4096, grade: auto}
      - {value: 8192, grade: auto}
      - {value: 16384, grade: confirm}
      - {value: 32768, grade: escalate}
    reasons: [preset_default, human_pin, serving_context, prior_cell_shape]

  # ── 출력 길이(토큰) ── 디코드 측정 창. 바꾸면 과거 셀과 TPOT 비교가 끊긴다 — 사용자 knob.
  output_len:
    owner: user
    kind: scalar
    default: 256
    serving_cap: none
    options:
      - {value: 128, grade: escalate}
      - {value: 256, grade: auto}
      - {value: 512, grade: escalate}
      - {value: 1024, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 레벨당 측정 요청 수 ──
  num_prompts:
    owner: user
    kind: scalar
    default: 16
    serving_cap: none
    options:
      - {value: 16, grade: auto}
      - {value: 32, grade: escalate}
      - {value: 64, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 레벨당 버리는 워밍업 요청 수 ──
  warmups:
    owner: user
    kind: scalar
    default: 2
    serving_cap: none
    options:
      - {value: 1, grade: escalate}
      - {value: 2, grade: auto}
      - {value: 4, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 반복 수 ── full 정의는 반복 ≥3 이다(하한은 repeat_axis.FULL_REPEATS_MIN 이 소유 · 로더가 교차검증).
  repeats:
    owner: user
    kind: scalar
    default: 3
    serving_cap: none
    options:
      - {value: 3, grade: auto}
      - {value: 4, grade: escalate}
      - {value: 5, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 요청 포맷 ── 기본값 없음(2026-09-07 결정 유지 · TPOT 을 바꾸는 1급 측정 축). Agent 가 모델 계열에서 고른다.
  backend:
    owner: agent
    kind: scalar
    default: null
    serving_cap: none
    options:
      - {value: openai, grade: auto}
      - {value: openai-chat, grade: auto}
    reasons: [human_pin, harmony_completion, chat_template, prior_cell_shape]

  # ── 벤치 컨테이너 메모리 몫(MiB) ── 기본값 없음(§4.8 · 호스트 안전 예산). --tool guidellm 일 때만 쓴다.
  #   run_bench 의 벤치 예산 게이트가 노드 서빙 바닥에서 상한을 말한다 — 그 상한 이하 선택지를 고른다.
  #   2048 은 2026-10-10 E2E 셀 B(gpt-oss-120b single · 상한 2990MiB)에서 교집합이 비어 추가했다(사용자 승인).
  bench_budget_mib:
    owner: agent
    kind: scalar
    default: null
    serving_cap: none
    options:
      - {value: 2048, grade: auto}
      - {value: 4096, grade: auto}
      - {value: 8192, grade: auto}
      - {value: 16384, grade: confirm}
    reasons: [human_pin, host_budget]

  # ── 데이터셋 축(2026-10-16 · plan_26101614) ── 입력 텍스트의 출처만 바꾼다. 길이는 input_len/output_len 이 정하고
  #   (전처리가 입력을 정확히 input_len 토큰에 맞춘다) 출력은 ignore_eos 로 고정 — 판정 규칙은 그대로다.
  #   기본 = synthetic(GuideLLM synthetic_text · 개정 전과 같은 명령). synthetic 이면 아래 knob 은 전부 null 이다.
  #   실제 데이터셋은 사용자 프리셋(비추적)에서 선언한다 — README.md "사용자 프리셋 만들기".
  dataset_kind:
    owner: user
    kind: scalar
    default: synthetic
    serving_cap: none
    options:
      - {value: synthetic, grade: auto}
      - {value: parquet_file, grade: escalate}
      - {value: json_file, grade: escalate}
      - {value: csv_file, grade: escalate}
    reasons: [preset_default, human_pin]

  dataset_source:
    owner: user
    kind: scalar
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
      - {value: managed, grade: escalate}
      - {value: custom, grade: escalate}
      - {value: ephemeral, grade: escalate}
    reasons: [preset_default, human_pin]

  dataset_id:
    owner: user
    kind: text
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
    reasons: [preset_default, human_pin]

  dataset_path:
    owner: user
    kind: path
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
    reasons: [preset_default, human_pin]

  dataset_revision:
    owner: user
    kind: hex40
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
    reasons: [preset_default, human_pin]

  source_sha256:
    owner: user
    kind: hex64
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
    reasons: [preset_default, human_pin]

  column_map:
    owner: user
    kind: map
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
    reasons: [preset_default, human_pin]

  preprocess_strategy:
    owner: user
    kind: scalar
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
      - {value: concatenate, grade: escalate}
      - {value: ignore, grade: escalate}
      - {value: pad, grade: escalate}
      - {value: error, grade: escalate}
    reasons: [preset_default, human_pin]

  seed:
    owner: user
    kind: scalar
    default: null
    serving_cap: none
    options:
      - {value: null, grade: auto}
    reasons: [preset_default, human_pin]
