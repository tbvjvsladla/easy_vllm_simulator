# default_preset.yaml — full-bench(현재 구현체 GuideLLM) 측정 형상 프리셋
#
# 이 파일이 full-bench 측정 형상의 **유일한 기본값 층**이다(plan_26101011 · interview_20261010_015151).
# sweep_bench.sh 는 여기 없는 기본값을 쓰지 않는다 — 코드 안 리터럴은 걷어냈다.
#
# 편집 규칙
#   · 값만 조정한다. 키를 늘리거나 지우는 것은 계약 변경이며 selftest_bench_preset.py(리뷰 시점)와
#     기동 로더 bench_preset.py(실행 시점)가 둘 다 막는다. 다른 도구의 블록이나 꺼 둔 블록을 실제 키로
#     남겨 두면 미지 키로 기동이 거부된다(무효 knob 방지).
#   · 커스텀 프리셋은 이 폴더에 <이름>.yaml 로 만든다. 같은 스키마 검증을 통과해야 하고,
#     `sweep_bench.sh --preset <이름>` 으로 고른다(미지정 = default_preset).
#
# 읽는 법 — knob 마다 세 가지가 보인다
#   owner   누가 조정하나. agent = 서빙전략(explorer 산출)에서 파생해 Agent 가 고른다 · user = 사용자만 바꾼다
#   options 고를 수 있는 값의 닫힌 목록. 목록 밖 값은 누가 넣어도 기동 거부다(선택지를 늘리려면 이 파일을 고친다)
#   grade   그 값을 **누가 열 수 있나**
#             auto     Agent 가 자유롭게 고른다
#             confirm  셀별 사전 승인(plan HITL · 캠페인 선언 확인 팝업의 사람 발화 전사 --approved-by)이 있을 때만 Agent 가 고른다
#             escalate 사람 핀으로만 열린다(campaign.yaml budgets.bench_pins · CLI --pinned-by)
#   등급은 정적으로 여기 적힌다 — 자기신뢰도나 확률로 등급을 고르지 않는다. user knob 의 비기본 값은 전부 escalate 다.
#
# 해소 순서: 사람 핀(CLI --pinned-by) > 사람 핀(campaign.yaml) > Agent 선택(--knob-reason 근거 코드 필수) > 이 파일의 default.
# serving_cap: explorer 서빙 yaml 의 한계로 options 를 거르는 상한 필터(필터일 뿐 값을 만들지 않는다)
#   le_max_num_seqs                       레벨 원소 ≤ max-num-seqs 만 남긴다
#   input_plus_output_le_max_model_len    input_len + output_len ≤ max-model-len 이어야 한다
#   none                                  거르지 않는다

schema_version: 1
bench: full-bench
tool: guidellm

# ── 근거 코드 ── Agent 가 값을 남길 때 쓰는 코드의 유일한 정의 자리. knob 은 이름만 참조한다.
reason_codes:
  preset_default: 프리셋 기본값 그대로
  human_pin: 사람 핀(campaign.yaml budgets.bench_pins · CLI --pinned-by · --repeats-source 선언 전달)
  serving_context: explorer 서빙 yaml 의 context window(max-model-len)에 맞춤
  serving_concurrency: explorer 서빙 yaml 의 동시 시퀀스 한계(max-num-seqs)에 맞춤
  harmony_completion: harmony 계열(gpt-oss) → 완결 엔드포인트(openai)
  chat_template: chat 템플릿 엔드포인트(openai-chat)
  host_budget: 노드 서빙 예산 선언에 맞춘 벤치 컨테이너 메모리 몫
  prior_cell_shape: 비교할 과거 셀의 측정 형상에 맞춤

knobs:
  # ── 동시성 레벨 ── 판정점 1 은 항상 포함된다(verdict 재사용). 서빙 max-num-seqs 를 넘는 레벨은 걸러진다.
  levels:
    owner: agent
    kind: list
    default: [1, 2, 4, 8, 16]
    serving_cap: le_max_num_seqs
    options:
      - {value: 1, grade: auto}
      - {value: 2, grade: auto}
      - {value: 4, grade: auto}
      - {value: 8, grade: auto}
      - {value: 16, grade: auto}
      - {value: 32, grade: confirm}
    reasons: [preset_default, human_pin, serving_concurrency, prior_cell_shape]

  # ── 입력 프롬프트 길이(토큰) ── 서빙 context window 안에서만 유효하다.
  input_len:
    owner: agent
    kind: scalar
    default: 1024
    serving_cap: input_plus_output_le_max_model_len
    options:
      - {value: 512, grade: auto}
      - {value: 1024, grade: auto}
      - {value: 2048, grade: auto}
      - {value: 4096, grade: auto}
      - {value: 8192, grade: auto}
      - {value: 16384, grade: confirm}
      - {value: 32768, grade: escalate}
    reasons: [preset_default, human_pin, serving_context, prior_cell_shape]

  # ── 출력 길이(토큰) ── 디코드 측정 창. 바꾸면 과거 셀과 TPOT 비교가 끊긴다 — 사용자 knob.
  output_len:
    owner: user
    kind: scalar
    default: 256
    serving_cap: none
    options:
      - {value: 128, grade: escalate}
      - {value: 256, grade: auto}
      - {value: 512, grade: escalate}
      - {value: 1024, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 레벨당 측정 요청 수 ──
  num_prompts:
    owner: user
    kind: scalar
    default: 16
    serving_cap: none
    options:
      - {value: 16, grade: auto}
      - {value: 32, grade: escalate}
      - {value: 64, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 레벨당 버리는 워밍업 요청 수 ──
  warmups:
    owner: user
    kind: scalar
    default: 2
    serving_cap: none
    options:
      - {value: 1, grade: escalate}
      - {value: 2, grade: auto}
      - {value: 4, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 반복 수 ── full 정의는 반복 ≥3 이다(하한은 repeat_axis.FULL_REPEATS_MIN 이 소유 · 로더가 교차검증).
  repeats:
    owner: user
    kind: scalar
    default: 3
    serving_cap: none
    options:
      - {value: 3, grade: auto}
      - {value: 4, grade: escalate}
      - {value: 5, grade: escalate}
    reasons: [preset_default, human_pin]

  # ── 요청 포맷 ── 기본값 없음(2026-09-07 결정 유지 · TPOT 을 바꾸는 1급 측정 축). Agent 가 모델 계열에서 고른다.
  backend:
    owner: agent
    kind: scalar
    default: null
    serving_cap: none
    options:
      - {value: openai, grade: auto}
      - {value: openai-chat, grade: auto}
    reasons: [human_pin, harmony_completion, chat_template, prior_cell_shape]

  # ── 벤치 컨테이너 메모리 몫(MiB) ── 기본값 없음(§4.8 · 호스트 안전 예산). --tool guidellm 일 때만 쓴다.
  #   run_bench 의 벤치 예산 게이트가 노드 서빙 바닥에서 상한을 말한다 — 그 상한 이하 선택지를 고른다.
  #   2048 은 2026-10-10 E2E 셀 B(gpt-oss-120b single · 상한 2990MiB)에서 교집합이 비어 추가했다(사용자 승인).
  bench_budget_mib:
    owner: agent
    kind: scalar
    default: null
    serving_cap: none
    options:
      - {value: 2048, grade: auto}
      - {value: 4096, grade: auto}
      - {value: 8192, grade: auto}
      - {value: 16384, grade: confirm}
    reasons: [human_pin, host_budget]
