[package]
name = "recipe-runtime"
version = "0.1.0"
edition = "2021"
description = "Deterministic recipe numerics of the vllm-recipe-explorer skill: quant bytes table, VRAM estimate, ranking; Rust port of quant_table.py, estimate_vram.py and rank_recipes.py"
publish = false
# `tests/` is a scratch name in this repository; integration checks live in `checks/`.
autotests = false

