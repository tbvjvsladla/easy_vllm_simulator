[features]
# Provider injection for the RAM-gate checks. No production build enables it; the default build has no controlled machine.
fixture = []

# The fixture-feature checks build under this profile (artifacts in `fixture/`, never in `release/`).
[profile.fixture]
inherits = "release"

[dependencies]
# Python-compatible typed data and text semantics shared with the other owner packages (path dependency).
agent-runtime-support = { path = "../../../../rust/runtime-support" }
# The same locked versions the common package uses; needed directly for the arbitrary-precision integers of the formulas.
num-bigint = "0.4"
num-traits = "0.2"
# The one network call of the model scripts (Hugging Face model metadata over HTTP/HTTPS): the same small synchronous client the
# benchmark owner already pins, with the same features, and the two helpers that pick the host's CA certificates (both were
# already in the dependency tree of that client). No model is ever downloaded.
ureq = { version = "=3.5.0", default-features = false, features = ["rustls"] }
rustls-native-certs = { version = "0.8", default-features = false }
openssl-probe = "0.2"
# The trusted authorities are chosen the way OpenSSL chooses them (hashed directories): the subject hash is a SHA-1 of the
# canonical name, with the digest the benchmark owner already pins; the certificate errors are told apart by their rustls type.
ring = "=0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

