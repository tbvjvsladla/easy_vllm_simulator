<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1712 700" width="1712" height="700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">campaigns 아티팩트 체인과 세션 리볼버</title>
  <desc id="dsc">캠페인 선언(campaign.yaml)의 assignments 가 메인과 서브의 셀 리스트를 나누고 서로 다른 노드의 리스트는 동시에 돈다. 각 셀은 build → serve → bench → publish 네 phase 를 지나며 phase 마다 proof 와 source 를 가진 status 파일을 남긴다. 상태 파일을 쓰는 문은 campaign_init.py 하나다. 세션 단절·예산 소진·하네스 전환이 일어나면 세션 리볼버가 --resume-brief 로 체크포인트를 읽어 다음 워커에게 재발급한다.</desc>

  <!-- 배색은 자기완결이다(아이보리 배경 고정) — skill-pipeline.svg 와 동일 규약. -->
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="ah-navy" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3864"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c00000"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1712" height="700" fill="#f0f0e3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans KR&quot;, &quot;Noto Sans CJK KR&quot;, NanumGothic, sans-serif">

    <!-- ══ 캠페인 선언 ══ -->
    <rect x="20" y="20" width="330" height="250" rx="22" fill="#fdfdfb" stroke="#1f3864" stroke-width="4" filter="url(#soft)"/>
    <text x="185" y="66" text-anchor="middle" font-size="30" font-weight="700" fill="#1f3864">campaign.yaml</text>
    <text x="185" y="108" text-anchor="middle" font-size="22" fill="#1a1a1a">전역 실행 계획표</text>
    <text x="50" y="152" font-size="20" fill="#333333">· matrix (버전 × 모델)</text>
    <text x="50" y="184" font-size="20" fill="#333333">· assignments (노드별 셀)</text>
    <text x="50" y="216" font-size="20" fill="#333333">· 예산 · 통제변인</text>
    <text x="50" y="248" font-size="20" fill="#333333">· hint 발행 사전승인</text>

    <path d="M 352,145 L 418,145" fill="none" stroke="#1f3864" stroke-width="5" marker-end="url(#ah-navy)"/>

    <!-- ══ CAMPAIGN 배정 ══ -->
    <rect x="425" y="20" width="900" height="250" rx="18" fill="none" stroke="#555555" stroke-width="3" stroke-dasharray="12 8"/>
    <text x="875" y="58" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a" letter-spacing="2">CAMPAIGN · assignments</text>

    <rect x="450" y="82" width="850" height="78" rx="12" fill="#e4e4dc"/>
    <text x="470" y="132" font-size="26" font-weight="600" fill="#1a1a1a">main :</text>
    <rect x="580" y="96" width="170" height="52" rx="8" fill="#fdfdfb" stroke="#555555" stroke-width="2.5"/>
    <text x="665" y="131" text-anchor="middle" font-size="24" fill="#1a1a1a">[cell A]</text>
    <path d="M 752,122 L 893,122" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#ah-ink)"/>
    <rect x="900" y="96" width="170" height="52" rx="8" fill="#fdfdfb" stroke="#555555" stroke-width="2.5"/>
    <text x="985" y="131" text-anchor="middle" font-size="24" fill="#1a1a1a">[cell B]</text>
    <path d="M 1072,122 L 1180,122" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#ah-ink)"/>

    <text x="470" y="222" font-size="26" font-weight="600" fill="#1a1a1a">sub :</text>
    <rect x="720" y="186" width="170" height="52" rx="8" fill="#d6e0f0" stroke="#1f3864" stroke-width="3"/>
    <text x="805" y="221" text-anchor="middle" font-size="24" fill="#1a1a1a">[cell C]</text>
    <path d="M 892,212 L 1033,212" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#ah-ink)"/>
    <rect x="1040" y="186" width="170" height="52" rx="8" fill="#fdfdfb" stroke="#555555" stroke-width="2.5"/>
    <text x="1125" y="221" text-anchor="middle" font-size="24" fill="#1a1a1a">[cell D]</text>

    <!-- 병렬 배지 -->
    <rect x="1350" y="40" width="345" height="104" rx="16" fill="#1f3864" filter="url(#soft)"/>
    <text x="1522" y="84" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">노드별 리스트는</text>
    <text x="1522" y="120" text-anchor="middle" font-size="24" font-weight="700" fill="#ffffff">동시에 돈다</text>
    <rect x="1350" y="160" width="345" height="104" rx="16" fill="#fdfdfb" stroke="#1f3864" stroke-width="3"/>
    <text x="1522" y="202" text-anchor="middle" font-size="21" fill="#1a1a1a">셀 종료 뒤 전이</text>
    <text x="1522" y="238" text-anchor="middle" font-size="21" font-weight="600" fill="#1f3864">AUTO · HITL · STAY</text>

    <!-- 셀 확대 연결 -->
    <path d="M 722,240 L 470,330 M 888,240 L 1240,330" fill="none" stroke="#555555" stroke-width="2.5" stroke-dasharray="8 6"/>

    <!-- ══ Cell = phase 체인 ══ -->
    <rect x="410" y="330" width="900" height="190" rx="18" fill="#fdfdfb" stroke="#1f3864" stroke-width="4" filter="url(#soft)"/>
    <text x="860" y="368" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1a1a">Cell — 노드별 E2E 한 단위</text>

    <rect x="440" y="388" width="170" height="60" rx="10" fill="#b9d7a8" stroke="#4f7a3a" stroke-width="2.5"/>
    <text x="525" y="427" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">build</text>
    <path d="M 612,418 L 653,418" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#ah-ink)"/>
    <rect x="660" y="388" width="170" height="60" rx="10" fill="#f4e3a1" stroke="#9c7f1c" stroke-width="2.5"/>
    <text x="745" y="427" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">serve</text>
    <path d="M 832,418 L 873,418" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#ah-ink)"/>
    <rect x="880" y="388" width="170" height="60" rx="10" fill="#f2c39c" stroke="#a65a1e" stroke-width="2.5"/>
    <text x="965" y="427" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">bench</text>
    <path d="M 1052,418 L 1093,418" fill="none" stroke="#111111" stroke-width="3" marker-end="url(#ah-ink)"/>
    <rect x="1100" y="388" width="170" height="60" rx="10" fill="#cfcfcf" stroke="#555555" stroke-width="2.5"/>
    <text x="1185" y="427" text-anchor="middle" font-size="26" font-weight="600" fill="#1a1a1a">publish</text>

    <text x="860" y="488" text-anchor="middle" font-size="21" fill="#333333">phase 마다 <tspan font-weight="700" fill="#c00000">&lt;phase&gt;.status.json</tspan> = 결과 + proof{ ok, <tspan font-weight="700">source</tspan> } · 실패해도 쓴다</text>

    <!-- ══ 단일 writer ══ -->
    <rect x="20" y="330" width="330" height="190" rx="22" fill="#fdfdfb" stroke="#555555" stroke-width="3" filter="url(#soft)"/>
    <text x="185" y="374" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">쓰는 문은 하나</text>
    <text x="185" y="414" text-anchor="middle" font-size="22" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#1f3864">campaign_init.py</text>
    <text x="185" y="456" text-anchor="middle" font-size="19" fill="#333333">포맷 소유 1 · 호출부 N</text>
    <text x="185" y="490" text-anchor="middle" font-size="19" fill="#333333">각 phase 실행 스크립트가 호출</text>
    <path d="M 352,425 L 403,425" fill="none" stroke="#555555" stroke-width="3" marker-end="url(#ah-ink)"/>

    <!-- ══ 세션 리볼버 ══ -->
    <rect x="410" y="572" width="1290" height="110" rx="55" fill="#1f3864" filter="url(#soft)"/>
    <text x="520" y="618" font-size="30" font-weight="700" fill="#ffffff">Session Revolver</text>
    <text x="520" y="656" font-size="20" fill="#d6e0f0">relay.py --supervise-step · 메인도 워커일 수 있다</text>
    <text x="1000" y="618" font-size="21" fill="#ffffff">세션 단절 · 예산 소진 · 하네스/모델 전환</text>
    <text x="1000" y="656" font-size="21" fill="#ffffff">→ <tspan font-weight="700" fill="#f4e3a1">--resume-brief</tspan> 체크포인트 → 다음 워커 재발급</text>

    <path d="M 1500,570 L 1500,535 C 1500,520 1420,520 1340,470 L 1318,455" fill="none" stroke="#c00000" stroke-width="4" marker-end="url(#ah-red)"/>
    <path d="M 860,522 L 860,566" fill="none" stroke="#1f3864" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ah-navy)"/>

    <!-- 왼쪽 하단 문제 3종 -->
    <rect x="20" y="572" width="330" height="110" rx="18" fill="#fbecec" stroke="#c00000" stroke-width="3"/>
    <text x="185" y="614" text-anchor="middle" font-size="19" font-weight="700" fill="#c00000">False Positive · Context Loss</text>
    <text x="185" y="652" text-anchor="middle" font-size="19" font-weight="700" fill="#c00000">Bottleneck 에 대응</text>
  </g>
</svg>
