<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1640 680" width="1640" height="680" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">vllm-recipe-explorer 두 패턴</title>
  <desc id="dsc">왼쪽 Generate &amp; Filter 패턴: 모델 양자화, KV 양자화, 컨텍스트(max-model-len), 메모리 활용률(gpu-memory-utilization) 네 입력이 깔때기로 모여 유효 상한(예산 GiB × 안전마진) 하드게이트 — weights + overhead + KV ≤ 유효 상한 — 를 통과한 안전한 후보군 서빙 레시피가 도출된다. HITL 로 동시성(max-num-seqs)을 정한 뒤 오른쪽 Loop Until Done 패턴으로 넘어간다: 기동 테스트 전 준비작업(RAM 가용량 확인) → 스모크 테스트 및 판정(OOM/서빙실패) → KV 캐시 재산정(CLI 플래그 변수 조정) → 재시도(루프 cap 차감) 순환을 돌다가 /health 200 이면 수렴 완료로 kv-cache-memory-bytes 가 확정된다.</desc>

  <!-- 배색은 자기완결이다(아이보리 배경 고정) — skill-pipeline.svg 와 동일 규약. -->
  <defs>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="9.5" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="22" markerHeight="22" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e75b6"/>
    </marker>
    <marker id="ah-loop" viewBox="0 0 10 10" refX="8" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="34" markerHeight="34" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e75b6"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="8" refY="5"
            markerUnits="userSpaceOnUse" markerWidth="26" markerHeight="26" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e01010"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1640" height="680" fill="#f0f0e3"/>

  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Apple SD Gothic Neo&quot;, &quot;Malgun Gothic&quot;, &quot;Noto Sans KR&quot;, &quot;Noto Sans CJK KR&quot;, NanumGothic, sans-serif">

    <!-- ═══════════ 좌 — Generate & Filter 패턴 ═══════════ -->
    <rect x="70" y="14" width="510" height="62" fill="#fdfcf7" stroke="#8a8a82" stroke-width="1.5" filter="url(#soft)"/>
    <text x="325" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#1a1a1a">Generate &amp; Filter 패턴</text>

    <!-- 4 입력 축 -->
    <rect x="38" y="148" width="112" height="78" rx="6" fill="#2e75b6" filter="url(#soft)"/>
    <text x="94" y="182" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">모델</text>
    <text x="94" y="212" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">양자화</text>

    <rect x="162" y="118" width="106" height="78" rx="6" fill="#2e75b6" filter="url(#soft)"/>
    <text x="215" y="152" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">KV</text>
    <text x="215" y="182" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">양자화</text>

    <rect x="280" y="94" width="170" height="80" rx="6" fill="#2e75b6" filter="url(#soft)"/>
    <text x="365" y="128" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">컨텍스트</text>
    <text x="365" y="158" text-anchor="middle" font-size="19" fill="#ffffff">max-model-len</text>

    <rect x="462" y="150" width="182" height="98" rx="6" fill="#2e75b6" filter="url(#soft)"/>
    <text x="553" y="184" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">메모리 활용률</text>
    <text x="553" y="211" text-anchor="middle" font-size="18" fill="#ffffff">gpu-memory-</text>
    <text x="553" y="234" text-anchor="middle" font-size="18" fill="#ffffff">utilization</text>

    <g fill="none" stroke="#2e75b6" stroke-width="12">
      <path d="M 100,230 L 195,278" marker-end="url(#ah-blue)"/>
      <path d="M 220,200 L 262,272" marker-end="url(#ah-blue)"/>
      <path d="M 362,178 L 348,268" marker-end="url(#ah-blue)"/>
      <path d="M 520,252 L 418,278" marker-end="url(#ah-blue)"/>
    </g>

    <!-- 깔때기 -->
    <polygon points="86,300 514,300 348,505 348,566 252,566 252,505" fill="#2e75b6" filter="url(#soft)"/>
    <ellipse cx="300" cy="296" rx="216" ry="40" fill="#fdfdfb" stroke="#2e75b6" stroke-width="6"/>

    <!-- 하드게이트 공식 -->
    <rect x="88" y="352" width="460" height="120" rx="4" fill="#fffefa" stroke="#9a9a94" stroke-width="2" filter="url(#soft)"/>
    <!-- 다색 행은 tspan 에 명시 x 를 준다 — text-anchor=middle+무좌표 tspan 은 렌더러 편차가 크다 -->
    <text y="390" text-anchor="start" font-size="26"><tspan x="123" font-weight="700" fill="#843c0c">유효 상한</tspan><tspan x="242" fill="#1a1a1a">= 예산(GiB) ×</tspan><tspan x="412" font-weight="600" fill="#e36c09">안전마진</tspan></text>
    <text x="318" y="424" text-anchor="middle" font-size="26" fill="#1a1a1a">게이트 통과 조건 =</text>
    <text y="458" text-anchor="start" font-size="26"><tspan x="98" fill="#1a1a1a">weights + overhead + KV ≤</tspan><tspan x="434" font-weight="700" fill="#843c0c">유효 상한</tspan></text>

    <!-- 산출 -->
    <rect x="195" y="592" width="230" height="78" fill="#dce6f1" stroke="#55606e" stroke-width="2" filter="url(#soft)"/>
    <text x="310" y="624" text-anchor="middle" font-size="24" fill="#1a1a1a">안전한 후보군</text>
    <text x="310" y="656" text-anchor="middle" font-size="24" fill="#1a1a1a">서빙 레시피 도출</text>

    <!-- HITL 동시성 -->
    <rect x="575" y="490" width="192" height="100" rx="4" fill="#c55a11" filter="url(#soft)"/>
    <text x="671" y="530" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">HITL → 동시성</text>
    <text x="671" y="566" text-anchor="middle" font-size="21" fill="#ffffff">max-num-seqs</text>

    <g fill="none" stroke="#111111" stroke-width="9">
      <path d="M 428,626 L 562,548" marker-end="url(#ah-ink)"/>
      <path d="M 762,498 L 862,450" marker-end="url(#ah-ink)"/>
    </g>

    <!-- ═══════════ 분리선 ═══════════ -->
    <line x1="774" y1="15" x2="774" y2="665" stroke="#44506a" stroke-width="2.5"/>

    <!-- ═══════════ 우 — Loop Until Done 패턴 ═══════════ -->
    <rect x="940" y="14" width="470" height="62" fill="#fdfcf7" stroke="#8a8a82" stroke-width="1.5" filter="url(#soft)"/>
    <text x="1175" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#1a1a1a">Loop Until Done 패턴</text>

    <!-- 순환 호 (시계방향) -->
    <g fill="none" stroke="#2e75b6" stroke-width="16">
      <path d="M 1007,385 A 165,165 0 0 1 1115,230" marker-end="url(#ah-loop)"/>
      <path d="M 1229,232 A 165,165 0 0 1 1327,329" marker-end="url(#ah-loop)"/>
      <path d="M 1337,385 A 165,165 0 0 1 1228,540" marker-end="url(#ah-loop)"/>
      <path d="M 1115,540 A 165,165 0 0 1 1010,412" marker-end="url(#ah-loop)"/>
    </g>
    <text x="1352" y="272" text-anchor="middle" font-size="25" font-weight="700" fill="#7b2c00">/health 200</text>

    <!-- 루프 상태 4개 -->
    <rect x="1075" y="112" width="200" height="112" rx="8" fill="#1f3864" filter="url(#soft)"/>
    <text x="1175" y="148" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">스모크 테스트</text>
    <text x="1175" y="178" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">및 판정</text>
    <text x="1175" y="208" text-anchor="middle" font-size="20" fill="#ffffff">(OOM/ 서빙실패)</text>

    <rect x="1335" y="330" width="196" height="112" rx="8" fill="#1f3864" filter="url(#soft)"/>
    <text x="1433" y="366" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">KV 캐시 재 산정</text>
    <text x="1433" y="396" text-anchor="middle" font-size="20" fill="#ffffff">CLI 플래그</text>
    <text x="1433" y="424" text-anchor="middle" font-size="20" fill="#ffffff">변수 조정</text>

    <rect x="1085" y="530" width="180" height="96" rx="8" fill="#1f3864" filter="url(#soft)"/>
    <text x="1175" y="568" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">재시도</text>
    <text x="1175" y="600" text-anchor="middle" font-size="20" fill="#ffffff">루프 cap 차감</text>

    <rect x="810" y="330" width="205" height="112" rx="8" fill="#1f3864" filter="url(#soft)"/>
    <text x="912" y="366" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">기동 테스트 전</text>
    <text x="912" y="394" text-anchor="middle" font-size="24" font-weight="600" fill="#ffffff">준비작업</text>
    <text x="912" y="424" text-anchor="middle" font-size="20" fill="#ffffff">RAM 가용량 확인</text>

    <!-- 수렴 탈출 -->
    <path d="M 1470,328 L 1532,222" fill="none" stroke="#e01010" stroke-width="15" marker-end="url(#ah-red)"/>
    <polygon points="1425,88 1630,88 1630,203 1450,203 1425,178" fill="#375623" filter="url(#soft)"/>
    <text x="1528" y="126" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">수렴 완료</text>
    <text x="1528" y="158" text-anchor="middle" font-size="20" fill="#ffffff">kv-cache-</text>
    <text x="1528" y="186" text-anchor="middle" font-size="20" fill="#ffffff">memory-bytes</text>

  </g>
</svg>
