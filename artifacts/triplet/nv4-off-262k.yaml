# nvidia/Qwen3.8-Flash-Next-NVFP4 서빙 설정 (vllm-recipe-explorer 생성)
# 레시피: quant=none max_model_len=262144 gpu_mem_util=0.9
model: <manifest.nas_model_path>/nvidia/Qwen3.8-Flash-Next-NVFP4
host: 0.0.0.0
port: 8080
# gpu-memory-utilization = startup free-memory 게이트 + 총 cap(통합메모리 ≤0.90); 실제 KV·이식성은 kv-cache-memory-bytes 절대 클램프가 제어
gpu-memory-utilization: 0.9
max-model-len: 262144
max-num-seqs: 8
kv-cache-memory-bytes: 17179869184
tensor-parallel-size: 2
enforce-eager: true
