# A1 기준선 — 직전 레거시 셀과 같은 축(KV 20GiB)으로 재수행해 하네스 교정 전후 음성대조
model: /app/quant_models/Qwen/Qwen3.8-Flash-Next-NVFP4
host: 0.0.0.0
port: 8080
