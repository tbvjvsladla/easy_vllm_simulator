# 셀 nv4-bf-262k-mmp — camp-26090918-qwen38fn-multi cell 2/24
# 선언 축: variant=nvfp4 · kv_cache_dtype=auto · context=262144(YaRN off) · PLE=mmap
# 셀 1 (res) 대비 축: PLE resident → mmap (62-qwen4exp-ple-mmap · VLLM_PLE_MMAP=1)
model: /app/quant_models/Qwen/Qwen3.8-Flash-Next-NVFP4
host: 0.0.0.0
port: 8080
tensor-parallel-size: 2
distributed-executor-backend: ray
gpu-memory-utilization: 0.85
max-model-len: 262144
kv-cache-dtype: auto
kv-cache-memory-bytes: 21474836480   # 20GiB/노드 초기 클램프 — mmap 으로 PLE VRAM 회수(~24GiB/노드) → KV 여유 확장 잠재(셀 lockset 수렴에서 재확정)
enforce-eager: true            # 그래프 ON 은 mmap 셀 레버로(캡처 스파이크 분리)
async-scheduling: false        # MTP+async 금지(0.29 자동비활성 안 탐 — 명시 필수)
speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
