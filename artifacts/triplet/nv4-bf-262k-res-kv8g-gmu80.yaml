# 셀 nv4-bf-262k-res-kv8g-gmu80 — camp-26091216-qwen38fn-res-min
# 선언 축: variant=NVFP4 · kv=auto · ctx=262144 · PLE=resident · KV클램프 8192MiB/노드 + 배치 레버
# B1-b(개정) — B1-a 가 로드 피크로 사살(MemAvail 10,086<10,240). KV 회수분 12,288 을 피크가 그대로 되먹음.
# 처방: KV 계단이 아니라 프로파일링 피크 억제(plan §6 R5 가 예견한 분기)
model: /app/quant_models/Qwen/Qwen3.8-Flash-Next-NVFP4
host: 0.0.0.0
port: 8080
tensor-parallel-size: 2
distributed-executor-backend: ray
gpu-memory-utilization: 0.80   # 마진 레버 — KV↔피크 상쇄의 천장 가설 검증(0.85→0.80 = vLLM 몫 -6,231MiB)
max-model-len: 262144
kv-cache-dtype: auto
kv-cache-memory-bytes: 8589934592   # 8192MiB/노드
enforce-eager: true            # 승계 통제변인(캡처 스파이크 ~10GiB 회피)
async-scheduling: false        # MTP+async 금지(0.29 자동비활성 안 탐 — 명시 필수)
speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
max-num-seqs: 8                 # 피크 억제 레버 ① — 기본(1024)이 만드는 activation 예약을 줄인다
max-num-batched-tokens: 2048    # 피크 억제 레버 ② — 프로파일링 더미 배치가 사살 지점이었다
