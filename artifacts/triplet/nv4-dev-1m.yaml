# nvidia/Qwen3.8-Flash-Next-NVFP4 서빙 설정 (vllm-recipe-explorer 생성)
# 레시피: quant=none max_model_len=1048576 gpu_mem_util=0.9
model: <manifest.nas_model_path>/nvidia/Qwen3.8-Flash-Next-NVFP4
host: 0.0.0.0
port: 8080
# gpu-memory-utilization = startup free-memory 게이트 + 총 cap(통합메모리 ≤0.90); 실제 KV·이식성은 kv-cache-memory-bytes 절대 클램프가 제어
gpu-memory-utilization: 0.9
max-model-len: 1048576
max-num-seqs: 8
kv-cache-memory-bytes: 25769803776
tensor-parallel-size: 2
hf-overrides: '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"partial_rotary_factor":0.25,"rope_theta":10000000,"rope_type":"yarn","factor":4,"original_max_position_embeddings":262144},"max_position_embeddings":1048576}}'
enforce-eager: true
