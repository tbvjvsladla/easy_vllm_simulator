# ⚠ 형상(shape) — 운영자 절대경로는 플레이스홀더로 가렸다.
#   <repo> · <manifest.nas_model_path> · <manifest-derived VLLM_VENV> 는 각자 환경에서 온다.
#   어떤 변수가 필요한지가 재현 정보이고, 값은 배포 대상이 아니다(계약 §3).
# Qwen/Qwen3.8-Flash-Next-FP8 서빙 설정 (vllm-recipe-explorer 생성)
# 레시피: quant=none max_model_len=524288 gpu_mem_util=0.9
model: <manifest.nas_model_path>/Qwen/Qwen3.8-Flash-Next-FP8
host: 0.0.0.0
port: 8080
# gpu-memory-utilization = startup free-memory 게이트 + 총 cap(통합메모리 ≤0.90); 실제 KV·이식성은 kv-cache-memory-bytes 절대 클램프가 제어
gpu-memory-utilization: 0.9
max-model-len: 524288
max-num-seqs: 8
kv-cache-memory-bytes: 17179869184
tensor-parallel-size: 2
hf-overrides: '{"text_config":{"rope_parameters":{"mrope_interleaved":true,"mrope_section":[11,11,10],"partial_rotary_factor":0.25,"rope_theta":10000000,"rope_type":"yarn","factor":2,"original_max_position_embeddings":262144},"max_position_embeddings":524288}}'
enforce-eager: true
