# OpenAI/gpt-oss-120b 서빙 설정 (vllm-recipe-explorer 생성)
# 레시피: quant=mxfp4 max_model_len=131072 gpu_mem_util=0.9
# ── VRAM 분해 (Phase 2 절대 KV 클램프 기준) ──
#   weights: 65.96 GiB
#   kv_cache: 30.0 GiB
#   budget: 121.7 GiB
model: /app/models/OpenAI/gpt-oss-120b
host: 0.0.0.0
port: 8000
# gpu-memory-utilization = startup free-memory 게이트 + 총 cap(통합메모리 ≤0.90); 실제 KV·이식성은 kv-cache-memory-bytes 절대 클램프가 제어
gpu-memory-utilization: 0.9
max-model-len: 131072
max-num-seqs: 16
kv-cache-memory-bytes: 32212254720
kv-cache-dtype: fp8
quantization: mxfp4
max-num-batched-tokens: 8192
