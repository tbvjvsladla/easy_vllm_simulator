# OpenAI/gpt-oss-120b 서빙 설정 (vllm-recipe-explorer 생성)
# 레시피: quant=mxfp4 max_model_len=8192 gpu_mem_util=0.8
# 출처(explorer 각인): gpu-memory-utilization ← gmu_source=target_gmu
# ── VRAM 분해 (Phase 2 절대 KV 클램프 기준) ──
#   weights: 66.14 GiB
#   kv_cache: 0.43528246972709894 GiB
#   budget: 121.6877 GiB
# ── 타겟-GPU 이식 클램프 (host≠target, gpu_model=NVIDIA GB10) ──
# host-측정 weights/overhead 이전값. target≠host arch 면 target-margin 이 쿠션(정량보증 아님).
# 가능하면 타겟에서 재측정(Phase-2)을 권장. per-token-KV·weights 는 GPU-불변, overhead 는 런타임 성질 일부 포함.
model: /app/models/OpenAI/gpt-oss-120b
host: 0.0.0.0
port: 8000
# gpu-memory-utilization = startup free-memory 게이트(기동 전 free ≥ ceil(total×gmu) · 통합메모리 ≤0.90) + 총량 cap 은 관측된 작용(한 셀 관측 · 유효맥락 kv-clamp.md §1 · vLLM 소스에서 기전 미확정); 실제 KV·이식성은 kv-cache-memory-bytes 절대 클램프가 제어
gpu-memory-utilization: 0.8
max-model-len: 8192
kv-cache-memory-bytes: 467380993
quantization: mxfp4
