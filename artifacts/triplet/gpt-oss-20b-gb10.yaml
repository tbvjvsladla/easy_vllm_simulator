# OpenAI/gpt-oss-20b 멀티노드 서빙 설정 (TP=2 · P5 살3)
# 기준: 서브가 single 에서 자율 확정한 레시피(devlog_26090322) — KV 절대클램프 10 GiB 로 실증.
#
# ── single → multi TP=2 이식 근거 ──
#   서브 single 실측: weights 13.72 GiB · KV 10 GiB(절대클램프) · 218,448 tokens · 53.23x@4096.
#   TP=2 는 weights 를 샤딩하므로 노드당 약 6.86 GiB. KV 도 워커당 값이므로 5 GiB × 2 = 총 10 GiB
#   로 두어 **single 과 같은 서빙 능력**을 만든다(측정 차이를 TP 효과로 귀속시키기 위함).
#   ⚠ 중재자는 스모크다 — 기동 로그의 `reserved … for KV Cache` 로 확인한다.
model: /app/models/OpenAI/gpt-oss-20b
host: 0.0.0.0
# 멀티는 network_mode: host — 이 값이 곧 호스트 포트다(SERVING_PORT 와 일치시킨다).
port: 8080
tensor-parallel-size: 2
# 멀티노드 TP 필수 노브(없으면 multiprocessing 으로 가서 World size 오류).
distributed-executor-backend: ray
# Ray·NCCL 이 로드 전 통합메모리를 점유하므로 single 의 0.90 을 쓸 수 없다(P5 실측).
gpu-memory-utilization: 0.80
max-model-len: 4096
max-num-seqs: 32
kv-cache-memory-bytes: 5368709120
kv-cache-dtype: fp8
quantization: mxfp4
max-num-batched-tokens: 8192
