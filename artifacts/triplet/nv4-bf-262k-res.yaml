# 셀 nv4-bf-262k-res — camp-26090918-qwen38fn-multi cell 1/24 (P0-1 스모크 검증 설정 계승)
# variant=nvfp4 · kv=auto(bf16) · ctx=262144(YaRN off) · PLE=resident · MTP k=3 · async off
model: /app/quant_models/Qwen/Qwen3.8-Flash-Next-NVFP4
host: 0.0.0.0
port: 8080
tensor-parallel-size: 2
distributed-executor-backend: ray
gpu-memory-utilization: 0.85
max-model-len: 262144
kv-cache-dtype: auto
kv-cache-memory-bytes: 21474836480   # 20GiB/노드 초기 클램프 — lockset 수렴에서 재확정
enforce-eager: true            # L-graph 레버가 그래프를 연다(캡처 스파이크 ~10GiB — overhead 재무장 선행)
async-scheduling: false        # MTP+async 금지(0.29 는 mtp 를 eagle 계열로 분류해 자동비활성 안 탐 — 명시 필수)
speculative-config: '{"method":"mtp","num_speculative_tokens":3}'
