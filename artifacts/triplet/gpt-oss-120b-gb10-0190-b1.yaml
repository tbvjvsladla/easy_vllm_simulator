# OpenAI/gpt-oss-120b 멀티노드 서빙 설정 (TP=2 · P5 살2 — vLLM 0.19.0)
# 기준: output/single/configs/gpt-oss-120b-gb10.yaml (같은 모델·같은 vLLM 0.18.0)
#
# ── single → multi 이식 근거 (carry-forward 가 아니라 재확정) ──
#   single 은 1노드 TP=1 로 weights 65.96 GiB 를 한 노드에 얹고 KV 30.0 GiB 를 절대 클램프했다.
#   TP=2 는 weights 를 두 노드에 샤딩하므로 노드당 약 33 GiB 다. KV 도 TP 로 샤딩되며
#   `kv-cache-memory-bytes` 는 **워커(노드)당** 값이다 — 그래서 15 GiB × 2 = 총 30 GiB 로 두어
#   **single 과 같은 서빙 능력**(같은 max-model-len · 같은 max-num-seqs)을 만든다.
#   그래야 측정 차이가 TP 효과로 귀속된다. KV 를 키우면 능력이 달라져 비교가 성립하지 않는다.
#   ⚠ 이 값은 가설이며 중재자는 스모크다 — 기동 로그의 `Available KV cache memory` 로 확인한다.
#
# ── VRAM 분해(노드당 · GB10 121.7 GiB) ──
#   weights ≈ 32.98 GiB (65.96 ÷ 2)   kv_cache 15.0 GiB   여유 ≈ 73 GiB
model: /app/models/OpenAI/gpt-oss-120b
host: 0.0.0.0
port: 8080
tensor-parallel-size: 2
# ★ 멀티노드 TP 는 이 노브가 **필수**다(2026-09-04 실측). 없으면 vLLM 이 기본 multiprocessing
#   경로로 가서 `World size (2) is larger than the number of available GPUs (1) in this node`
#   로 죽는다 — Ray 클러스터가 정상 형성돼 있어도(로그: `Slave node connected. Cluster ready
#   with 2 GPUs`) 그것을 쓰지 않기 때문이다. 에러 메시지가 해법을 그대로 지목한다.
distributed-executor-backend: ray
# gpu-memory-utilization = startup free-memory 게이트 + 총 cap; 실제 KV 는 절대 클램프가 제어
# ★ 멀티는 single 의 0.9 를 그대로 쓸 수 없다(2026-09-04 실측). Ray 워커·NCCL 프록시가
#   **가중치 로드 전에 이미** 통합메모리를 점유해 startup free 가 줄어든다:
#     single: free 114.38/121.69 GiB → 0.9(109.52) 통과
#     multi : free 105.98/121.69 GiB → 0.9(109.52) **거부**
#       `ValueError: Free memory on device cuda:0 (105.98/121.69 GiB) on startup is less than
#        desired GPU memory utilization (0.9, 109.52 GiB)`
#   0.80 = 97.4 GiB 상한. 실제 필요는 weights 32.98 + KV 15.0 + 오버헤드 ≈ 60 GiB 이므로
#   충분하고, free 변동(Ray 오버헤드는 실행마다 다르다)에 대한 여유도 남는다.
#   ⚠ gmu 를 낮춰도 **KV 는 절대 클램프가 정하므로 single 과의 비교 조건은 유지**된다.
gpu-memory-utilization: 0.80
max-model-len: 131072
max-num-seqs: 20
kv-cache-memory-bytes: 25841106944
kv-cache-dtype: fp8
quantization: mxfp4
max-num-batched-tokens: 8192

# ── B0 탐침 설계 (2026-09-05) ──
#   0.19.1 은 분산 초기화의 torch.compile 에서 죽었다(`get_hash_factors: unsupported type for key
#   '_stateless_dp_group_port_list' (FieldInfo)` → BackendCompilerFailed · 120b·20b 동일 지점).
#   0.18.0 은 같은 TP=2 로 53.92 t/s 를 냈다. 회귀는 (0.18.0, 0.19.1] 구간에 있고 **0.19.0 은
#   한 번도 시험하지 않았다**. 그래서 이 셀은 **버전 하나만** 움직인다 —
#   enforce-eager 를 넣지 않는 이유가 그것이다(0.19.1 의 eager 는 *우회*였고, 여기서 묻는 것은
#   우회가 필요한지 자체다). 실패하면 회귀 진입점이 (0.18.0, 0.19.0] 로 좁혀지고, 그때 0.18.0 으로
#   폴백한다(사용자 결정 2026-09-05).

# ── 캠페인 2 셀 b1 ──
#   기준선(타겟 H100 80GiB 파생 KV). 축 이동 없음 — 이후 셀의 증분 기준.
#   타겟 파생: 80 GiB × 0.90 − weights/2(31113MiB) − overhead/2(17971MiB) = 24644 MiB/노드
