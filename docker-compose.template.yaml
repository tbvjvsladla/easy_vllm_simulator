# 스켈레톤 — render_dockerfile.py(G2)가 manifest+버전해소값으로 채움
x-gpu-common: &gpu-common
  build:
    context: .
    dockerfile: Dockerfile
  image: {{ IMAGE_NAME }}:{{ IMAGE_TAG }}
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  volumes:
    - {{ NAS_MODEL_PATH }}:/app/models:ro # 모델 폴더는 읽기모드로만 (manifest.nas_model_path)
    - ${TIKTOKEN_HOST_PATH}:/encodings:ro
    - ./configs:/app/configs:ro

services:
  vllm:
    <<: *gpu-common
    container_name: vllm_server # 디버그 모드일 시 컨테이름은 vllm_server로
    profiles: [debug]
    ports:
      - "8081:8000" # 디버그 포트는 8081로 고정 -> 서빙 프로필이랑 포트가 겹치지 말 것!
    environment:
      TIKTOKEN_ENCODINGS_BASE: /encodings
    command: ["bash"]
    tty: true
    stdin_open: true

  vllm-serve:
    <<: *gpu-common
    container_name: ${CONTAINER_NAME:-vllm-serve-container}
    profiles: [serve]
    ports:
      - "${SERVING_PORT:-8080}:8000"
    environment:
      TIKTOKEN_ENCODINGS_BASE: /encodings
    env_file:
      - envs/.env.${CONFIG_FILE:-default}
    command: ["bash", "/app/configs/${CONFIG_FILE:-default}.sh"]
