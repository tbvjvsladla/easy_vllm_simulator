# 스켈레톤 — render_dockerfile.py(G2)가 manifest+버전해소값으로 채움
x-gpu-common: &gpu-common
  build:
    context: .
    dockerfile: {{ DOCKERFILE }}   # 트랙별: Dockerfile(wheel) | Dockerfile.source-build(source)
  image: {{ IMAGE_NAME }}:{{ IMAGE_TAG }}
  runtime: nvidia
  ipc: host
  ulimits:
    memlock: -1
    stack: 67108864
  volumes:
    - ${NAS_MODEL_PATH:-/mnt/models}:/app/models:ro # 호스트 NAS 루트(env; 테라포밍이 manifest.nas_model_path→env 전파). PII는 compose에 baking 안 함
    - ${TIKTOKEN_HOST_PATH:-./tiktoken_cache}:/encodings:ro # tiktoken 평탄폴더(gpt-oss용). 변수명·기본값 align (P3 카탈로그)
    - ./configs:/app/configs:ro

services:
  vllm:
    <<: *gpu-common
    container_name: vllm_server # 디버그 모드일 시 컨테이름은 vllm_server로
    profiles: [debug]
    ports:
      - "8081:8000" # 디버그 포트는 8081로 고정 -> 서빙 프로필이랑 포트가 겹치지 말 것!
    environment:
      TIKTOKEN_ENCODINGS_BASE: /encodings
      TIKTOKEN_RS_CACHE_DIR: /encodings
    command: ["bash"]
    tty: true
    stdin_open: true

  vllm-serve:
    <<: *gpu-common
    container_name: ${CONTAINER_NAME:-vllm-serve-container}
    profiles: [serve]
    ports:
      - "${SERVING_PORT:-8080}:8000"
    environment:
      TIKTOKEN_ENCODINGS_BASE: /encodings
      TIKTOKEN_RS_CACHE_DIR: /encodings
    env_file:
      - envs/.env.${CONFIG_FILE:-default}
    command: ["bash", "/app/configs/${CONFIG_FILE:-default}.sh"]
