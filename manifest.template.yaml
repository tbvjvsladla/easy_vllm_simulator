# 환경 매니페스트 (템플릿) — 테라포밍 스킬과 version-watch/recipe 스킬 사이의 단일 계약 인터페이스.
#
# 사용법: 테라포밍이 이 템플릿을 채워 **output/<topology>/manifest.yaml**(브랜치 파생 통로, gitignore — 사용자 실값)로 산출한다.
#   topology=브랜치 결정(single-node=single / multi-node=multi) → 브랜치 빈번 전환 시 재작성 0(전환=그 통로 manifest 읽음). 근거: plan_2026062315_1.
# 테라포밍 스킬이 <auto: ...> 필드는 자동탐지로 제안하고, <interview> 필드는 사람에게 물어 채운다.
# 헌법(CLAUDE.md)·스킬은 환경 구체값(노드·NAS·origin)을 output/<topology>/manifest.yaml 에서 읽는다 — 헌법에 하드코딩하지 않는다.
#
# ⚠️ target_gpu_budget_gib 는 여기 두지 않는다 — recipe-explorer 의 config.yaml(런 단위 노브)에 있다.

# === 토폴로지 / 하드웨어 (대부분 자동탐지) ===
topology: <single|multi>          # 자동탐지 제안 + 사람확인(인터뷰). 멀티 = 아래 nodes[] 사용
cpu_arch: "<auto: uname -m>"      # 자동탐지(aarch64 | x86_64). NGC 베이스·manylinux 선정 입력
cuda_version: "<auto: nvcc 또는 인터뷰>"   # 자동탐지(nvcc --version), 실패 시 인터뷰. 예: "129"
gpus_per_node: <int>              # 노드당 GPU 수(탈-DGX 일반화 — tp 산정 입력). 예: 1
gpu_model: "<auto: nvidia-smi --query-gpu=name>"   # 노드 GPU 모델명(서브 페르소나 정체성 bake). 예: "NVIDIA GB10". 미탐지 시 빈값 → 렌더러가 arch×count 로 폴백

# === 테라포밍 완수 Flag (attestation · plan_2026063018_1 · 헌법 §테라포밍-완수 Flag 게이트 따름정리) ===
# scan_node 가 §1.5(topology 확정 + branch↔topology 3자일치) 통과 시에만 complete:true 기입(보수적 — 미검증이면 false 유지).
# manifest_contract.py 게이트 입력: complete != true → 3 런타임 스킬(upstream·recipe·adversarial) info-only.
terraforming:
  complete: false                 # §1.5 3자일치 통과 시에만 true. 강행 금지(완수율 위해 미검증 true ✗).
  branch_verified: false          # git 브랜치 ↔ topology ↔ scan 3자일치 단언(§1.5) 통과 여부
  scanned_at: ""                  # 검증 스캔 시각(YYYYMMDDHH 또는 ISO)

# === 모델 확보 정책 3종 (인터뷰 — 헌법 §모델 획득 모드 따름정리 3종 · 결정트리 · plan_2026063018_1) ===
# managed   = 사람이 사전 다운로드해 관리 NAS 경로(nas_model_path)에 둔 모델을 read-only 마운트(폐쇄망 기본·권장).
# ephemeral = 컨테이너 내부 HF 캐시에 임시 다운로드(컨테이너 down→삭제). **다수 기본** — NAS 미보유 환경.
# custom    = 사용자 지정 경로에 모델 저장·볼륨마운트("이 모델은 이 경로에"). custom_model_paths 매핑 사용.
# 불변식: 서빙 런타임 마운트는 read-only(런타임 무단 다운로드 없음). 모델 부재 → 중단·보고 → 사용자 승인 게이트 후 모드별 위치 다운로드(전 모드 공통 시퀀스).
model_source: <managed|ephemeral|custom>   # 자동탐지(NAS에 스모크 모델 존재 여부) 제안 + 사람확인
nas_model_path: /mnt/models       # managed 모드 관리 NAS 루트(read-only 마운트원 → /app/models). 환경마다 다름. 해소 = config>env>manifest>default.
custom_model_paths: {}            # custom 모드: {모델디렉토리명: 호스트 절대경로} 매핑 → 그 경로를 볼륨마운트.
hf_token_env_file: ""             # ephemeral/custom 다운로드 시 HF 토큰이 담긴 env 파일 경로(gitignored). ⚠ raw 토큰 비추적 — 여긴 포인터만.

# === 서브 모델/인코딩 자산 호스트 경로 (serve-time env materialize 입력 — 헌법 §serve-time env 통로 불변식) ===
quant_model_path: ""              # 별도 양자화(NVFP4 등) 모델 NAS 루트. compose /app/quant_models 마운트원. 미사용 시 빈값.
tiktoken_host_path: ""            # tiktoken o200k/harmony 인코딩 자산 호스트 경로(에어갭 사전적재). compose /encodings 마운트원. 미사용 시 빈값.

# === 사용자 git remote (선택) ===
origin_url: ""                    # optional — 사용자 환경의 git remote URL. 없으면 빈 문자열(로컬 전용)

# === 인터커넥트 (멀티노드 고속망 정체성 — 테라포밍 진입 스캔이 자동탐지) ===
# 탐지원: /sys/class/infiniband(HCA) + show_gids(RoCE v2 GID·IP·iface). ibstat 미설치 환경 대비 sysfs 우선.
# 단일노드면 type: generic-ethernet, 나머지 비움. 환경정체성 필드만 — NCCL 튜닝상수(GDR/QPS 등)는 platform_preset 으로 렌더 프리셋에서.
# 근거: docs/plan/plan_2026062312_1(통로) · plan_2026062311_1(진입루틴) · CLAUDE.md 산출물 통로 불변식.
interconnect:
  type: <RoCE v2 | infiniband | generic-ethernet>   # 자동탐지(show_gids VER); 불명확 시 인터뷰
  hca_devices: []              # 자동탐지(/sys/class/infiniband). 예: [rocep1s0f1, roceP2p1s0f1]
  gid_index: <int|null>        # 자동탐지(show_gids RoCE v2 + IPv4 행의 INDEX). 예: 3
  socket_iface: <name>         # NCCL/Gloo bootstrap iface. 예: enp1s0f1np1
  mtu: <int|null>              # iface MTU(서브 정체성 bake; RoCE 보통 9000). 미지정 시 렌더러 기본 9000
  bandwidth_gbps: <num|null>   # ib_write_bw 합산 실측(성능 게이트 기준선). 예: 218. 미측정=null
  platform_preset: <key>       # 렌더 튜닝상수(NCCL GDR/QPS/CROSS_NIC 등) 프리셋 키. 예: dgx-spark-gb10

# === 멀티노드 전용 — topology: multi 일 때만 채운다 (전부 인터뷰) ===
# 각 항목: role(main|sub) · host(IP 또는 호스트명) · ssh_user(passwordless SSH 계정) · work_dir(레포 작업경로).
# 단일노드면 이 목록은 비워둔다.
# work_dir: 그 노드에서 레포가 사는 절대경로. sync_to_sub.sh·multinode_*smoke.sh 가 여기서 해소(하드코딩 금지 — 포인터 원칙).
#   서브 work_dir 기본값 = 메인 work_dir 와 동일(R2, plan_2026062320_1). 미지정 시 스크립트가 로컬 $REPO 로 유도.
#   ⚠ 서브 work_dir 신설은 반드시 HITL(sync_to_sub.sh --provision 승인) — 자동 경로 신설 금지(R2).
nodes:
  - role: main
    host: <IP_or_hostname>        # 인터뷰 — 메인 노드 주소
    ssh_user: <user>              # 인터뷰 — SSH 계정
    work_dir: <abs_path>          # 메인 레포 루트(예 /home/<user>/ws_docker/easy_vllm_simulator). 미지정 시 로컬 $REPO.
  - role: sub
    host: <IP_or_hostname>        # 인터뷰 — 서브 노드 주소
    ssh_user: <user>              # 인터뷰 — SSH 계정
    work_dir: <abs_path>          # 서브 작업환경. 기본값=메인 work_dir 와 동일(R2). ⚠ 신설은 HITL 후(자동신설 금지).
